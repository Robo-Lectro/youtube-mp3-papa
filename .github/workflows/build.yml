name: Build Mac App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp

      - name: Download static ffmpeg Mac
        run: |
          curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          chmod +x ffmpeg
          ./ffmpeg -version
          file ffmpeg

      - name: Build .app with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "YouTube-MP3-Papa" \
            --target-arch x86_64 \
            --add-binary "ffmpeg:." \
            --hidden-import yt_dlp \
            main_mac.py

      - name: Prepare app folder
        run: |
          mkdir -p dist/YouTube-MP3-Papa-Mac
          mv "dist/YouTube-MP3-Papa.app" "dist/YouTube-MP3-Papa-Mac/"

      - name: Create README
        run: |
          cat > "dist/YouTube-MP3-Papa-Mac/README.txt" << 'EOF'
          YouTube-MP3-Papa - Mac

          1. Ouvre YouTube-MP3-Papa.app.
          2. Colle un lien YouTube.
          3. Choisis le dossier de destination.
          4. Clique sur TÉLÉCHARGER EN MP3.

          Premier lancement :
          Si macOS affiche un avertissement, fais clic droit sur l'app, puis Ouvrir.
          EOF

      - name: Zip the app folder
        run: |
          cd dist
          zip -r YouTube-MP3-Papa-Mac.zip "YouTube-MP3-Papa-Mac"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-MP3-Papa-Mac
          path: dist/YouTube-MP3-Papa-Mac.zip
          retention-days: 30
